<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - VPN Manager</title>
    <script src="/static/js/i18n.js"></script>
    <style>
        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --primary-700: #1d4ed8;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --radius: 10px;
            --radius-lg: 16px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-100);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.9375rem;
            color: var(--gray-500);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            color: var(--gray-800);
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-500);
            background: white;
            box-shadow: 0 0 0 4px var(--primary-100);
        }

        .form-input:focus + .input-icon {
            color: var(--primary-500);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-500);
            cursor: pointer;
        }

        .checkbox-wrapper span {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .sso-section {
            margin-top: 20px;
        }

        .sso-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0 16px 0;
            color: var(--gray-400);
            font-size: 0.8125rem;
        }

        .sso-divider::before,
        .sso-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--gray-200);
        }

        .sso-divider span {
            padding: 0 12px;
            font-weight: 500;
        }

        .btn-sso {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 20px;
            border: 1.5px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-700);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-sso:hover {
            background: #f8fafc;
            border-color: var(--primary-500);
            color: var(--primary-600);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
        }

        .btn-sso:active {
            transform: translateY(0);
        }

        .sso-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            flex-shrink: 0;
        }

        .toast {
            background: white;
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            animation: toastIn 0.3s ease;
            border-left: 4px solid;
        }

        .toast-error {
            border-color: #ef4444;
        }

        .toast-success {
            border-color: #10b981;
        }

        .toast-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .toast-error .toast-icon {
            color: #ef4444;
        }

        .toast-success .toast-icon {
            color: #10b981;
        }

        .toast-message {
            flex: 1;
            font-size: 0.9375rem;
            color: var(--gray-700);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Language Switcher */
        .lang-switch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            color: #475569;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            outline: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .lang-switch-btn:hover {
            background: #eff6ff;
            border-color: #93c5fd;
            color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.12);
        }

        .lang-switch-btn:active {
            transform: translateY(0);
        }

        .lang-switch-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            flex-shrink: 0;
        }

        /* Mobile */
        @media (max-width: 480px) {
            html {
                font-size: 15px;
            }

            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-card {
                padding: 32px 24px;
            }

            .logo {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                <button type="button" class="lang-switch-btn" onclick="i18n.toggleLanguage()" title="Switch Language / 切换语言">
                    <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span class="current-lang-text">EN</span>
                </button>
            </div>
            <div class="login-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <h1 class="login-title" data-i18n="app.name">VPN Manager</h1>
                <p class="login-subtitle" data-i18n="login.subtitle">安全、高效的 VPN 管理平台</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username" data-i18n="login.username">用户名</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" class="form-input" data-i18n-placeholder="login.usernamePlaceholder" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="login.password">密码</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="form-input" data-i18n-placeholder="login.passwordPlaceholder" placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember">
                        <span data-i18n="login.rememberMe">记住我</span>
                    </label>
                </div>

                <button type="submit" class="btn" id="login-btn">
                    <span data-i18n="login.signIn">登录</span>
                </button>

                <div id="sso-section" class="sso-section" style="display: none;">
                    <div class="sso-divider">
                        <span data-i18n="login.orDivider">或通过以下方式登录</span>
                    </div>
                    <a href="/api/auth/sso/login" class="btn-sso" id="sso-btn">
                        <svg class="sso-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        <span id="sso-btn-text" data-i18n="login.ssoLogin">通过 SSO 单点登录</span>
                    </a>
                </div>
            </form>

            <div class="login-footer" data-i18n="login.footerBrand">
                VPN Manager
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const iconSvg = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
            
            toast.innerHTML = `${iconSvg}<span class="toast-message">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Check if SSO / OIDC is enabled
        fetch('/api/auth/sso/config')
            .then(res => res.json())
            .then(data => {
                if (data && data.enabled) {
                    const ssoSection = document.getElementById('sso-section');
                    const ssoBtnText = document.getElementById('sso-btn-text');
                    if (ssoSection) ssoSection.style.display = 'block';
                    if (ssoBtnText && data.provider_name) {
                        ssoBtnText.textContent = data.provider_name;
                    }
                }
            })
            .catch(() => {});

        // Check for URL error params (e.g. from SSO callback)
        const urlParams = new URLSearchParams(window.location.search);
        const ssoError = urlParams.get('error');
        if (ssoError) {
            const errorMap = {
                'invalid_state': 'SSO 认证状态已过期，请重试',
                'missing_code': 'SSO 授权失败：未收到授权码',
                'token_exchange_failed': 'SSO 换取令牌失败，请检查配置',
                'user_not_authorized': '未在本地系统授权该 SSO 账号',
                'sso_disabled': 'SSO 单点登录未启用',
                'sso_failed': 'SSO 登录失败，请重试或联系管理员'
            };
            showToast(errorMap[ssoError] || `SSO 登录失败: ${ssoError}`, 'error');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('login-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<div class="btn-spinner"></div>';
            btn.disabled = true;
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(t('login.signIn') + ' ' + t('common.success'), 'success');
                    localStorage.setItem('token', data.token);
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    showToast(data.message || t('login.invalidCreds'));
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            } catch (error) {
                showToast(t('login.networkError'));
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
