{% extends "base.html" %}

{% block title %}连接记录 - VPN Manager{% endblock %}
{% block page_title %}<span data-i18n="logs.title">VPN 连接记录</span>{% endblock %}

{% block content %}
<div class="page-actions">
    <button class="btn btn-secondary" onclick="loadConnectionLogs()">
        <i class="fas fa-sync-alt"></i>
        <span data-i18n="logs.refresh">刷新</span>
    </button>
    <button class="btn btn-secondary" onclick="exportLogs()">
        <i class="fas fa-download"></i>
        <span data-i18n="logs.export">导出</span>
    </button>
</div>

<!-- Stats Cards -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-plug"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label" data-i18n="logs.total">总连接数</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon online"><i class="fas fa-user-check"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label" data-i18n="logs.online">当前在线</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-clock"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-today">0</span>
            <span class="stat-label" data-i18n="logs.today">今日连接</span>
        </div>
    </div>
</div>

<!-- Connection List -->
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-list"></i> <span data-i18n="logs.title">连接记录</span></h2>
        <div class="log-filters">
            <input type="text" id="filter-client" 
                   data-i18n-placeholder="logs.searchPlaceholder"
                   placeholder="搜索客户端..." oninput="filterLogs()">
            <select id="filter-status" onchange="filterLogs()">
                <option value="" data-i18n="common.allStatus">全部状态</option>
                <option value="connected" data-i18n="common.connected">已连接</option>
                <option value="disconnected" data-i18n="common.disconnected">已断开</option>
            </select>
        </div>
    </div>
    <div class="card-body">
        <table class="data-table" id="connection-table">
            <thead>
                <tr>
                    <th data-i18n="logs.tableTime">时间</th>
                    <th data-i18n="logs.tableClient">客户端</th>
                    <th data-i18n="logs.tableType">类型</th>
                    <th data-i18n="logs.tableClientIp">IP 地址</th>
                    <th data-i18n="logs.tableStatus">状态</th>
                    <th data-i18n="common.actions">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr class="loading-row">
                    <td colspan="6"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="common.loading">加载中...</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detail-modal">
    <div class="modal-content modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> <span data-i18n="logs.detailTitle">连接详情</span></h3>
            <button class="btn-close" onclick="closeModal('detail-modal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div id="detail-content">
                <!-- Detail content will be inserted here -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('detail-modal')" data-i18n="common.close">关闭</button>
        </div>
    </div>
</div>

<style>
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #666;
}

.stat-icon.online {
    background: #e8f5e9;
    color: #4caf50;
}

.stat-info {
    display: flex;
    flex-direction: column;
}

.stat-value {
    font-size: 28px;
    font-weight: 700;
    color: #333;
}

.stat-label {
    font-size: 14px;
    color: #888;
}

.log-filters {
    display: flex;
    gap: 12px;
}

.log-filters input,
.log-filters select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}

.log-filters input {
    width: 200px;
}

.status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}

.status-badge.connected {
    background: #e8f5e9;
    color: #2e7d32;
}

.status-badge.disconnected {
    background: #ffebee;
    color: #c62828;
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.detail-item {
    background: #f8f9fa;
    padding: 16px;
    border-radius: 8px;
}

.detail-item.full-width {
    grid-column: 1 / -1;
}

.detail-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
}

.detail-value {
    font-size: 14px;
    color: #333;
    font-weight: 500;
    word-break: break-all;
}

.detail-value.mono {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
}

.modal-lg {
    max-width: 700px;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
let connectionLogs = [];
let currentDetail = null;

// Format datetime
function formatDateTime(dateString) {
    if (!dateString) return '-';
    const date = new Date(dateString);
    const lang = (window.i18n && i18n.getLanguage() === 'en') ? 'en-US' : 'zh-CN';
    return date.toLocaleString(lang);
}

// Load connection logs
async function loadConnectionLogs() {
    const tbody = document.querySelector('#connection-table tbody');
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6"><i class="fas fa-spinner fa-spin"></i> ${t('common.loading')}</td></tr>`;
    
    try {
        const response = await fetch('/api/connection-logs?_t=' + Date.now(), {
            headers: getAuthHeaders()
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }
            throw new Error(t('common.failed'));
        }
        
        const data = await response.json();
        connectionLogs = data.logs || [];
        updateStats(data.stats || {});
        renderLogs();
    } catch (error) {
        console.error('Error:', error);
        tbody.innerHTML = `<tr class="error-row"><td colspan="6"><i class="fas fa-exclamation-circle"></i> ${t('common.failed')}: ${error.message}</td></tr>`;
    }
}

// Update statistics
function updateStats(stats) {
    document.getElementById('stat-total').textContent = stats.total || 0;
    document.getElementById('stat-active').textContent = stats.active || 0;
    document.getElementById('stat-today').textContent = stats.today || 0;
}

// Render connection logs table
function renderLogs() {
    const tbody = document.querySelector('#connection-table tbody');
    const filterClient = document.getElementById('filter-client').value.toLowerCase();
    const filterStatus = document.getElementById('filter-status').value;
    
    let filtered = connectionLogs;
    
    if (filterClient) {
        filtered = filtered.filter(log => 
            (log.client_name || '').toLowerCase().includes(filterClient) ||
            (log.username || '').toLowerCase().includes(filterClient)
        );
    }
    
    if (filterStatus) {
        filtered = filtered.filter(log => log.status === filterStatus);
    }
    
    if (filtered.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${t('logs.noLogs')}</td></tr>`;
        return;
    }
    
    tbody.innerHTML = filtered.map(log => `
        <tr>
            <td>${formatDateTime(log.connected_at)}</td>
            <td>${escapeHtml(log.client_name || log.username || 'Unknown')}</td>
            <td>${escapeHtml(log.tunnel_type || 'IKEv2')}</td>
            <td>${escapeHtml(log.client_ip || '-')}</td>
            <td>
                <span class="status-badge ${log.status}">
                    ${log.status === 'connected' ? t('common.connected') : t('common.disconnected')}
                </span>
            </td>
            <td>
                <button class="btn-icon" onclick="showDetail('${log.id}')" title="${t('common.viewDetails')}">
                    <i class="fas fa-eye"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

// Filter logs
function filterLogs() {
    renderLogs();
}

// Show detail modal
function showDetail(logId) {
    const log = connectionLogs.find(l => l.id === logId);
    if (!log) return;
    
    currentDetail = log;
    const content = document.getElementById('detail-content');
    
    content.innerHTML = `
        <div class="detail-grid">
            <div class="detail-item">
                <div class="detail-label">${t('dashboard.connId')}</div>
                <div class="detail-value mono">${escapeHtml(log.id || '-')}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('common.status')}</div>
                <div class="detail-value">
                    <span class="status-badge ${log.status}">
                        ${log.status === 'connected' ? t('common.connected') : t('common.disconnected')}
                    </span>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.tableClient')}</div>
                <div class="detail-value">${escapeHtml(log.client_name || log.username || 'Unknown')}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.tableType')}</div>
                <div class="detail-value">${escapeHtml(log.tunnel_type || 'IKEv2')}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.tableClientIp')}</div>
                <div class="detail-value mono">${escapeHtml(log.client_ip || '-')}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.tableAssignedIp')}</div>
                <div class="detail-value mono">${escapeHtml(log.assigned_ip || '-')}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.connectTime')}</div>
                <div class="detail-value">${formatDateTime(log.connected_at)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">${t('logs.disconnectTime')}</div>
                <div class="detail-value">${log.disconnected_at ? formatDateTime(log.disconnected_at) : '-'}</div>
            </div>
            <div class="detail-item full-width">
                <div class="detail-label">${t('logs.rawLog')}</div>
                <div class="detail-value mono" style="font-size: 12px; white-space: pre-wrap;">${escapeHtml(log.raw_log || '-')}</div>
            </div>
        </div>
    `;
    
    openModal('detail-modal');
}

// Export logs
function exportLogs() {
    const csvContent = [
        [t('logs.tableTime'), t('logs.tableClient'), t('logs.tableType'), t('logs.tableClientIp'), t('logs.tableStatus')].join(','),
        ...connectionLogs.map(log => [
            log.connected_at,
            log.client_name || log.username || 'Unknown',
            log.tunnel_type || 'IKEv2',
            log.client_ip || '-',
            log.status === 'connected' ? t('common.connected') : t('common.disconnected')
        ].join(','))
    ].join('\n');
    
    const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vpn-connections-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// React to language switch
if (window.i18n) {
    i18n.onChange(() => {
        renderLogs();
    });
}

// Load on page load
loadConnectionLogs();

// Auto refresh every 10 seconds
setInterval(() => {
    loadConnectionLogs();
}, 10000);
</script>
{% endblock %}
