<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}VPN Manager{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/modern.css">
    <link rel="stylesheet" href="/static/css/vendor/fontawesome.min.css">
    <script src="/static/js/i18n.js"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user %}
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="菜单">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
    </button>
    
    <!-- Overlay -->
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <span class="brand-text" data-i18n="app.name">VPN Manager</span>
        </div>
        
        <div class="sidebar-user">
            <div class="user-avatar">
                <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="user-info">
                <div class="user-name">{{ user }}</div>
                <div class="user-role" data-i18n="nav.admin">管理员</div>
            </div>
        </div>
        
        <nav>
            <ul class="sidebar-menu">
                <li class="menu-item {% if request.url.path == '/' %}active{% endif %}">
                    <a href="/" class="menu-link" onclick="closeSidebar()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <span data-i18n="nav.overview">概览</span>
                    </a>
                </li>
                <li class="menu-item {% if request.url.path == '/users' %}active{% endif %}">
                    <a href="/users" class="menu-link" onclick="closeSidebar()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span data-i18n="nav.users">用户管理</span>
                    </a>
                </li>
                <li class="menu-item {% if request.url.path == '/certs' %}active{% endif %}">
                    <a href="/certs" class="menu-link" onclick="closeSidebar()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span data-i18n="nav.certs">证书管理</span>
                    </a>
                </li>
                <li class="menu-item {% if request.url.path == '/logs' %}active{% endif %}">
                    <a href="/logs" class="menu-link" onclick="closeSidebar()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        <span data-i18n="nav.logs">日志</span>
                    </a>
                </li>
                <li class="menu-item {% if request.url.path == '/debug' %}active{% endif %}">
                    <a href="/debug" class="menu-link" onclick="closeSidebar()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                        <span data-i18n="nav.debug">调试信息</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <div class="sidebar-footer-actions">
                <button onclick="i18n.toggleLanguage()" class="btn-sidebar-lang" title="Switch Language / 切换语言">
                    <i class="fas fa-globe"></i>
                    <span class="current-lang-text">EN</span>
                </button>
                <button onclick="logout()" class="btn-logout">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span data-i18n="nav.logout">退出登录</span>
                </button>
            </div>
        </div>
    </aside>
    {% endif %}

    <!-- Main Content -->
    <div class="main">
        {% if user %}
        <header class="header">
            <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="lang-switch-btn" onclick="i18n.toggleLanguage()" title="切换语言 / Switch Language">
                    <i class="fas fa-globe"></i>
                    <span class="current-lang-text">EN</span>
                </button>
            </div>
        </header>
        {% endif %}

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.querySelector('.sidebar-overlay').classList.remove('show');
        }
        
        // Close sidebar on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
        });
        
        // Toast notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const iconSvg = type === 'success' 
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
            
            toast.innerHTML = `
                ${iconSvg}
                <span class="toast-message">${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
